[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyco-csdb2snfg"
version = "0.3.0"
description = "Convert CSDB linear notation to SNFG glycan diagrams"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "yee fan"},
]
keywords = ["glycoinformatics", "glycan", "SNFG", "CSDB", "bioinformatics", "carbohydrate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "python-pptx>=0.6.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.scripts]
csdb2snfg = "csdb2snfg.cli:main"

[project.urls]
Homepage = "https://github.com/sosyphe/glyco-csdb2snfg"
Issues = "https://github.com/sosyphe/glyco-csdb2snfg/issues"

[tool.setuptools.packages.find]
where = ["src"]

# Package-scoped ruff configuration: nearest-ancestor discovery means only
# files under packages/glyco-csdb2snfg are affected; sibling workspace members
# stay on their own (or ruff's default) configuration. Run via
#   uvx ruff format packages/glyco-csdb2snfg
#   uvx ruff check --fix packages/glyco-csdb2snfg
# so no ruff dependency or uv.lock change is needed.
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
# Conservative set: pycodestyle defaults (E4/E7/E9) + warnings, pyflakes,
# isort and bugbear. No UP (would churn typing.List-style annotations across
# the py3.9-supported code for zero value), no N/C90/SIM/RUF.
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["csdb2snfg"]
